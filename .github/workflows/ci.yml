name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # vmctl backs tests/environment-parity.test.ts; that test skips itself
      # with a reason when the binary is absent, so this is best-effort, not
      # a hard requirement.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: WeZZard/vm-service
          path: .ci/vm-service

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .ci/vm-service/rust

      - name: Build vmctl
        working-directory: .ci/vm-service/rust
        run: cargo build --release -p vmctl

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Use the same npm as the release job
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # npm run check builds, typechecks, and runs npm test. It does not run
      # test:e2e, which drives a headless browser inside a real VM.
      - name: Build, typecheck, and test
        run: npm run check
        env:
          VMCTL: ${{ github.workspace }}/.ci/vm-service/rust/target/release/vmctl

      - name: Confirm generated files are committed
        run: |
          set -e
          if ! git diff --exit-code -- dist commands pi-prompts || [ -n "$(git status --porcelain -- dist commands pi-prompts)" ]; then
            echo "dist/, commands/ or pi-prompts/ is stale: run npm run build and commit the result" >&2
            exit 1
          fi

      - name: Check the packed package
        run: npm run verify:package
