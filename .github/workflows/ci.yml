name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # machctl backs tests/environment-parity.test.ts; that test skips itself
      # with a reason when the binary is absent, so this is best-effort, not
      # a hard requirement. It is built from the machine-service commit pinned
      # in .github/machine-service.commit, never the default branch's moving
      # head; `npm run pin:machine-service` moves the pin (DC-6x-ISO-5).
      - name: Read the pinned machine-service commit
        id: machine-service
        run: echo "commit=$(tr -d '[:space:]' < .github/machine-service.commit)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # machine-service's repository, under its name before the rename;
          # GitHub redirects the old name once the repository is renamed.
          repository: WeZZard/vm-service
          ref: ${{ steps.machine-service.outputs.commit }}
          path: .ci/machine-service

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .ci/machine-service/rust

      - name: Build machctl
        working-directory: .ci/machine-service/rust
        run: cargo build --release -p machctl

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Installed under the job's temporary directory and put first on the
      # job's PATH, not over the runner's global npm (DC-6x-ISO-5).
      - name: Use the same npm as the release job, for this job only
        run: |
          npm install --prefix "$RUNNER_TEMP/npm" npm@latest
          echo "$RUNNER_TEMP/npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # npm run check builds, typechecks, and runs npm test. It does not run
      # test:e2e, which drives a headless browser inside a real VM.
      - name: Build, typecheck, and test
        run: npm run check
        env:
          # The tests start from an empty environment; only MCP_RELAY_TEST_* inputs reach them (DC-6x-ISO-1).
          MCP_RELAY_TEST_MACHCTL: ${{ github.workspace }}/.ci/machine-service/rust/target/release/machctl

      - name: Confirm generated files are committed
        run: |
          set -e
          if ! git diff --exit-code -- dist commands pi-prompts || [ -n "$(git status --porcelain -- dist commands pi-prompts)" ]; then
            echo "dist/, commands/ or pi-prompts/ is stale: run npm run build and commit the result" >&2
            exit 1
          fi

      - name: Check the packed package
        run: npm run verify:package
