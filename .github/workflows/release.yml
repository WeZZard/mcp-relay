name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WeZZard/vm-service
          path: .ci/vm-service

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .ci/vm-service/rust

      - name: Build vmctl
        working-directory: .ci/vm-service/rust
        run: cargo build --release -p vmctl

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json agrees with the tag
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "package.json is at $pkg_version, but tag $GITHUB_REF_NAME implies $tag_version" >&2
            exit 1
          fi

      # Also typechecks and runs npm test, which includes the version-parity
      # test covering .claude-plugin/plugin.json and pi-mcp.json against
      # package.json. It does not run test:e2e, which drives a headless
      # browser inside a real VM.
      - name: Build, typecheck, and test
        run: npm run check
        env:
          VMCTL: ${{ github.workspace }}/.ci/vm-service/rust/target/release/vmctl

      - name: Confirm generated files are up to date
        run: |
          set -e
          if ! git diff --exit-code -- dist commands pi-prompts || [ -n "$(git status --porcelain -- dist commands pi-prompts)" ]; then
            echo "dist/, commands/ or pi-prompts/ is stale: the build above produced changes that were not committed" >&2
            exit 1
          fi

      # Pack once. The same tarball is checked, published and attached to the
      # GitHub release, so what was checked is exactly what ships.
      - name: Pack
        run: |
          set -e
          mkdir -p .release
          npm pack --pack-destination .release
          ls .release/*.tgz

      - name: Check the packed package
        run: node scripts/verify-package.mjs .release/*.tgz --version "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          published_version=$(npm view "@wezzard/mcp-relay@$tag_version" version 2>/dev/null || true)
          if [ "$published_version" = "$tag_version" ]; then
            echo "skip: @wezzard/mcp-relay@$tag_version is already published"
          else
            npm publish .release/*.tgz --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "skip: release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag .release/*.tgz
          fi
